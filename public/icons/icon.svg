<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- 3D Geometric Isometric Cube (Studio Core) -->
  <g transform="translate(256, 210) scale(1.15)">
    <!-- Top Face -->
    <polygon points="0,-90 78,-45 0,0 -78,-45" fill="url(#primaryGrad)" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="-78,-45 0,0 0,90 -78,45" fill="#4338ca" opacity="0.85" />
    <!-- Right Face -->
    <polygon points="0,0 78,-45 78,45 0,90" fill="#6366f1" opacity="0.9" />

    <!-- Center Accent Dot -->
    <circle cx="0" cy="0" r="8" fill="#38bdf8" />
  </g>

  <!-- Floating Stylus / Rocket Pen Graphic -->
  <g transform="translate(256, 360)">
    <!-- Brush Tip Flare -->
    <circle cx="0" cy="0" r="28" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.8" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    
    <!-- Dynamic Brush Stroke Arc -->
    <path d="M -140,-20 Q 0,40 140,-20" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
